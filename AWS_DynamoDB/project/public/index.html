<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students DynamoDB App</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #f4f6f8; margin: 0; padding: 30px; color: #222; }
  .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px;
               border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  h1 { margin-bottom: 4px; color: #1a3c6e; }
  .subtitle { margin-top: 0; color: #666; font-size: 14px; }
  form { margin: 20px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-row { display: flex; flex-direction: column; }
  label { font-size: 13px; margin-bottom: 4px; color: #444; }
  input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { grid-column: span 2; background: #1a3c6e; color: #fff; padding: 10px;
           border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
  button:hover { background: #142f57; }
  #statusMsg { font-size: 14px; min-height: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
  th { background: #f0f3f7; }
  .delete-btn { background: #c0392b; color: #fff; border: none; padding: 5px 10px;
                border-radius: 5px; cursor: pointer; font-size: 12px; }
  .delete-btn:hover { background: #962d22; }
</style>
</head>
<body>
  <div class="container">
    <h1>🎓 FreeCodes In Telugu Student Records (DynamoDB)</h1>
    <p class="subtitle">Table: <strong>StudentsDB</strong> &nbsp;|&nbsp; Region: <strong>ap-south-1</strong></p>

    <form id="studentForm">
      <div class="form-row">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="e.g. Priya Sharma" />
      </div>
      <div class="form-row">
        <label for="age">Age</label>
        <input type="number" id="age" required min="1" placeholder="e.g. 21" />
      </div>
      <div class="form-row">
        <label for="course">Course</label>
        <input type="text" id="course" required placeholder="e.g. B.Tech CSE" />
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="e.g. priya@example.com" />
      </div>
      <button type="submit">Add Student</button>
    </form>

    <p id="statusMsg"></p>

    <h2>All Students</h2>
    <table id="studentsTable">
      <thead>
        <tr>
          <th>Name</th><th>Age</th><th>Course</th><th>Email</th><th>Added On</th><th></th>
        </tr>
      </thead>
      <tbody id="studentsBody"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('studentForm');
    const statusMsg = document.getElementById('statusMsg');
    const studentsBody = document.getElementById('studentsBody');

    async function loadStudents() {
      try {
        const res = await fetch('/students');
        const students = await res.json();

        studentsBody.innerHTML = '';
        students
          .sort((a, b) => (a.CreatedAt < b.CreatedAt ? 1 : -1))
          .forEach((s) => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${s.Name}</td>
              <td>${s.Age}</td>
              <td>${s.Course}</td>
              <td>${s.Email}</td>
              <td>${new Date(s.CreatedAt).toLocaleString()}</td>
              <td><button class="delete-btn" data-id="${s.StudentId}">Delete</button></td>
            `;
            studentsBody.appendChild(row);
          });
      } catch (err) {
        statusMsg.textContent = 'Failed to load students.';
        statusMsg.style.color = 'red';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        name: document.getElementById('name').value,
        age: document.getElementById('age').value,
        course: document.getElementById('course').value,
        email: document.getElementById('email').value
      };

      try {
        const res = await fetch('/students', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Failed to add student');
        }

        statusMsg.textContent = 'Student added successfully!';
        statusMsg.style.color = 'green';
        form.reset();
        loadStudents();
      } catch (err) {
        statusMsg.textContent = err.message;
        statusMsg.style.color = 'red';
      }
    });

    studentsBody.addEventListener('click', async (e) => {
      if (e.target.classList.contains('delete-btn')) {
        const id = e.target.getAttribute('data-id');
        try {
          await fetch(`/students/${id}`, { method: 'DELETE' });
          loadStudents();
        } catch (err) {
          statusMsg.textContent = 'Failed to delete student.';
          statusMsg.style.color = 'red';
        }
      }
    });

    loadStudents();
  </script>
</body>
</html>
